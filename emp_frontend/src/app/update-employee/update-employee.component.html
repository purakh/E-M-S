<div class="form-page">

  <div class="form-card">

    <!-- HEADER -->
    <div class="form-header">
      <h2>Update Employee Details</h2>
    </div>

    <form #f="ngForm" (ngSubmit)="f.form.valid && onSubmit()" autocomplete="off">

      <!-- SECTION 1 -->
      <div class="form-section">
        <h4>Personal Information</h4>

        <div class="grid">

          <div class="field">
            <label>First Name</label>
            <input type="text"
              [(ngModel)]="employee.fname"
              name="fname"
              required minlength="3"
              #fname="ngModel"
              [class.error]="f.submitted && fname.invalid"
              placeholder="John">
          </div>

          <div class="field">
            <label>Last Name</label>
            <input type="text"
              [(ngModel)]="employee.lname"
              name="lname"
              required
              #lname="ngModel"
              [class.error]="f.submitted && lname.invalid"
              placeholder="Doe">
          </div>

          <div class="field full">
            <label>Email</label>
            <input type="email"
              [(ngModel)]="employee.email"
              name="email"
              required
              #email="ngModel"
              [class.error]="f.submitted && email.invalid"
              placeholder="john@example.com">
          </div>

        </div>
      </div>

      <!-- SECTION 2 -->
      <div class="form-section">
        <h4>Job Details</h4>

        <div class="grid">

          <div class="field">
            <label>Department</label>
            <select [(ngModel)]="employee.department" name="department" required>
              <option value="" disabled>Choose</option>
              <option>IT</option>
              <option>HR</option>
              <option>Finance</option>
              <option>Marketing</option>
            </select>
          </div>

          <div class="field">
            <label>Designation</label>
            <select [(ngModel)]="employee.designation" name="designation" required>
              <option value="" disabled>Choose</option>
              <option>Developer</option>
              <option>Manager</option>
              <option>Analyst</option>
              <option>Accountant</option>
            </select>
          </div>

          <div class="field">
            <label>Salary</label>
            <input type="number"
              [(ngModel)]="employee.salary"
              name="salary"
              required
              placeholder="50000">
          </div>

          <div class="field">
            <label>Joining Date</label>
            <input type="date"
              [(ngModel)]="employee.joiningDate"
              name="joiningDate"
              required>
          </div>

        </div>
      </div>

      <!-- ACTIONS -->
      <div class="actions">
        <button class="btn-primary">Save Changes</button>
        <button type="button" (click)="goToEmployeeList()" class="btn-secondary">Cancel</button>
      </div>

    </form>

  </div>

</div>
