<div class="dashboard">

  <div class="header">
    <h1>Employee Management</h1>
    <p>Manage and monitor employee records</p>
  </div>

  <!-- Search -->
  <div class="search-section">

    <form (ngSubmit)="searchEmployee()" class="search-form">

      <input
        [(ngModel)]="searchTerm"
        name="search"
        type="text"
        placeholder="Search employee by ID or Name..."
      />

      <button type="submit">
        🔍 Search
      </button>

    </form>

  </div>

  <!-- Table -->
  <div class="table-container">

    <table class="employee-table">

      <thead>
        <tr>
          <th>ID</th>
          <th>Name</th>
          <th>Email</th>
          <th>Department</th>
          <th>Designation</th>
          <th>Actions</th>
        </tr>
      </thead>

      <tbody>

        <tr *ngFor="let employee of employees">

          <td>#{{employee.id}}</td>
          <td>{{employee.fname}} {{employee.lname}}</td>
          <td>{{employee.email}}</td>

          <td>
            <span class="badge dept">
              {{employee.department}}
            </span>
          </td>

          <td>
            <span class="badge role">
              {{employee.designation}}
            </span>
          </td>

          <td class="actions">

            <button
            class="btn update"
            (click)="updateEmployee(employee.id)">
            ✏ Update
            </button>

            <button
            class="btn delete"
            (click)="deleteEmployee(employee.id)">
            🗑 Delete
            </button>

            <button
            class="btn view"
            (click)="detailsOfEmployee(employee.id)">
            👁 View
            </button>

          </td>

        </tr>

      </tbody>

    </table>

  </div>

</div>
