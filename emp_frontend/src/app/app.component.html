<div class="app-shell">

  <header class="topbar">
    <div class="topbar-inner">

      <a routerLink="/home" class="brand">
        <span class="brand-mark">EMS</span>
        <span class="brand-text">Employee Management System</span>
      </a>

      <button
        class="menu-toggle"
        type="button"
        (click)="isMenuOpen = !isMenuOpen"
        [attr.aria-expanded]="isMenuOpen"
        aria-label="Toggle navigation">
        <span></span>
        <span></span>
        <span></span>
      </button>

      <nav class="main-nav" [class.open]="isMenuOpen">
        <a routerLink="/home" routerLinkActive="active-link" class="nav-link" (click)="isMenuOpen = false">Home</a>
        <a routerLink="/show-all-employees" routerLinkActive="active-link" class="nav-link" (click)="isMenuOpen = false">Employees</a>
        <a routerLink="/add-employee" routerLinkActive="active-link" class="nav-link" (click)="isMenuOpen = false">Add Employee</a>

        <div class="mobile-actions">
          <a *ngIf="!isLoggedIn"
             routerLink="/login"
             class="btn btn-outline"
             (click)="isMenuOpen = false">
            Admin Login
          </a>

          <button *ngIf="isLoggedIn"
                  type="button"
                  (click)="logout()"
                  class="btn btn-primary">
            Logout
          </button>
        </div>
      </nav>

      <div class="topbar-actions desktop-actions">
        <a *ngIf="!isLoggedIn"
           routerLink="/login"
           class="btn btn-outline">
          Admin Login
        </a>

        <button *ngIf="isLoggedIn"
                type="button"
                (click)="logout()"
                class="btn btn-primary">
          Logout
        </button>
      </div>

    </div>
  </header>

  <main class="page-content">
    <router-outlet></router-outlet>
  </main>

  <footer class="site-footer">
    <div class="footer-inner">
      <p>© 2026 Employee Management System</p>
    </div>
  </footer>

</div>
